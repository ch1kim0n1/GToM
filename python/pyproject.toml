[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtom-cli"
version = "0.1.0"
description = "Cognitive defense and Theory of Mind system"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "GToM contributors" }]
keywords = [
    "theory-of-mind",
    "gtom",
    "llm",
    "conflict-detection",
    "ai-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ch1kim0n1/GToM"
Repository = "https://github.com/ch1kim0n1/GToM"
"Bug Tracker" = "https://github.com/ch1kim0n1/GToM/issues"

[project.scripts]
gtom = "gtom.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["gtom"]

[tool.hatch.build.targets.wheel.force-include]
"gtom/_bundle/gtom.cli.js" = "gtom/_bundle/gtom.cli.js"
"gtom/_bundle/tiktoken_bg.wasm" = "gtom/_bundle/tiktoken_bg.wasm"

[tool.hatch.build.targets.sdist]
include = [
    "gtom",
    "README.md",
    "pyproject.toml",
]
